name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # Test berjalan di Postgres, bukan sqlite — lihat phpunit.xml.
    # Port 55432/16379 menyamai docker-compose lokal supaya .env.example dipakai apa adanya.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: communityleague
          POSTGRES_DB: communityleague_local
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U communityleague -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # CACHE_STORE/SESSION_DRIVER/QUEUE_CONNECTION di .env.example = redis. Migrasi tabel
      # permission (Task 7) memanggil Cache::forget() saat migrate, jadi wajib ada.
      redis:
        image: redis:7-alpine
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Buat database test
        run: psql -h 127.0.0.1 -p 55432 -U communityleague -d postgres -c "CREATE DATABASE communityleague_test"

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check
